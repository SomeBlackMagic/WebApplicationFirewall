# Production WAF Configuration
# Recommended configuration for production deployments

proxy:
  host: "http://backend:8080"  # Update with your backend service

api:
  auth:
    enabled: true
    username: 'admin'
    password: 'CHANGE-THIS-PASSWORD'  # Use strong password!

metrics:
  enabled: true
  auth:
    enabled: true  # Protect metrics endpoint in production
    username: 'prometheus'
    password: 'CHANGE-THIS-PASSWORD'

wafMiddleware:
  mode: normal  # Actively blocks malicious requests

  bannedResponse:
    httpCode: 429
    json: ''
    html: ''
    htmlLink: ''

  # Client IP detection - adjust headers based on your proxy/CDN
  detectClientIp:
    headers:
      - "x-forwarded-for"
      - "x-real-ip"

  # Geolocation using local GeoIP databases
  detectClientCountry:
    method: geoip

  detectClientCity:
    method: geoip

  # Whitelist trusted sources
  whitelist:
    ips: []
    ipSubnet:
      - "10.0.0.0/8"        # Internal network
      - "192.168.0.0/16"    # Internal network
    geoCountry: []  # e.g., ["US", "GB"] to allow only specific countries
    geoCity: []

  # Blacklist (optional)
  blacklist:
    ips: []
    ipSubnet: []
    geoCountry: []  # e.g., ["KP"] to block specific countries
    geoCity: []

jailManager:
  enabled: true
  storage:
    driver: file  # Persist bans across restarts
    driverConfig:
      filePath: data/blocked_ips.json
      locker:
        enabled: true
        config:
          retries: 5

  filterRules:
    # Login brute force protection
    - name: "login-bruteforce"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions:
        - field: 'url'
          check:
            - method: 'equals'
              values: ["/login", "/auth", "/signin", "/api/auth/login"]
      period: 300     # 5 minutes
      limit: 5        # Only 5 login attempts
      duration: 900   # Ban for 15 minutes
      escalationRate: 2.0

    # API rate limiting per IP + endpoint
    - name: "api-rate-limit"
      type: "composite"
      uniqueClientKey: ["ip", "url"]  # Separate limits per endpoint
      conditions:
        - field: 'url'
          check:
            - method: 'regexp'
              values: ["/^\/api\//"]
      period: 60      # 1 minute
      limit: 100      # 100 requests per endpoint per minute
      duration: 300   # Ban for 5 minutes
      escalationRate: 1.5

    # Global rate limit per IP
    - name: "global-rate-limit"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions: []  # Applies to all requests
      period: 3600    # 1 hour
      limit: 5000     # 5000 requests per hour
      duration: 600   # Ban for 10 minutes
      escalationRate: 1.3

    # Block known bad bots
    - name: "block-bad-bots"
      type: "flexible"
      conditions:
        - field: 'user-agent'
          check:
            - method: 'regexp'
              values: ["/(sqlmap|nikto|nmap|masscan|nessus)/i"]
      period: 60
      limit: 1        # Block immediately
      duration: 86400 # Ban for 24 hours
      escalationRate: 2.0

sentry:
  enabled: false
  dsn: ''  # Set via SENTRY_DSN environment variable
  debug: false
