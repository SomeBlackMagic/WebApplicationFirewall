# Strict Security WAF Configuration
# Maximum protection with aggressive rules

# Operating mode
mode: normal

# Server port
port: 3000

# Client IP detection
detectClientIp:
  headers:
    - "x-forwarded-for"
    - "cf-connecting-ip"
    - "x-real-ip"

# Geolocation detection
detectClientCountry:
  method: geoip

detectClientCity:
  method: geoip

# GeoIP databases
geoip:
  countryPath: '/app/geoip_data/GeoLite2-Country.mmdb'
  cityPath: '/app/geoip_data/GeoLite2-City.mmdb'

# Proxy configuration
proxy:
  enabled: true
  host: "http://backend:8080"
  config:
    changeOrigin: true
    proxyTimeout: 30000

# Logging (verbose for security auditing)
log:
  level: 'info'
  transport: 'console'

# Metrics
metrics:
  enabled: true
  path: '/metrics'

# Sentry for error tracking
sentry:
  dsn: ""  # Set via SENTRY_DSN environment variable

# Whitelist only known good sources
whitelist:
  enabled: true
  ips:
    - "192.168.1.0/24"  # Office network only
  countries: []  # Consider limiting to specific countries
  cities: []

# Blacklist high-risk countries and known threats
blacklist:
  enabled: true
  countries:
    - "CN"  # Adjust based on your legitimate traffic
    - "RU"
    - "KP"
  linkUrl: "https://feeds.example.com/malicious-ips.json"
  updateInterval: 1800000  # Update every 30 minutes

# Jail system with aggressive rules
jailManager:
  enabled: true
  storage:
    driver: file
    driverConfig:
      filePath: '/app/data/blocked_ips.json'
      locker:
        enabled: true
        config:
          retries: 5
  syncInterval: 5000
  syncAlways: true  # Immediate persistence
  filterRules:
    # External threat intelligence
    - id: threat-feed
      type: static
      enabled: true
      linkUrl: "https://reputation.example.com/blocklist.json"
      updateInterval: 3600000

    # Extremely strict login protection
    - id: login-bruteforce
      type: composite
      enabled: true
      keys: ["ip"]
      conditions:
        - field: url
          method: contains
          values: ["/login", "/auth", "/signin", "/oauth"]
        - field: method
          method: equals
          values: ["POST"]
      limit: 3
      period: 600  # Only 3 attempts per 10 minutes
      duration: 3600  # 1 hour ban
      escalationRate: 3.0

    # Admin area - geo-restricted
    - id: admin-geo-block
      type: flexible
      enabled: true
      conditions:
        - field: url
          method: contains
          values: ["/admin", "/wp-admin", "/phpmyadmin"]
        - field: country
          method: notEquals
          values: ["US"]  # Only allow from US (adjust as needed)

    # Admin area - rate limited
    - id: admin-rate-limit
      type: composite
      enabled: true
      keys: ["ip"]
      conditions:
        - field: url
          method: contains
          values: ["/admin"]
      limit: 20
      period: 60
      duration: 1800
      escalationRate: 2.5

    # API - strict per-endpoint limits
    - id: api-per-endpoint
      type: composite
      enabled: true
      keys: ["ip", "url"]
      conditions:
        - field: url
          method: contains
          values: ["/api/"]
      limit: 30
      period: 60
      duration: 600
      escalationRate: 2.0

    # API - global limit per IP
    - id: api-global-limit
      type: composite
      enabled: true
      keys: ["ip"]
      conditions:
        - field: url
          method: contains
          values: ["/api/"]
      limit: 300
      period: 60
      duration: 1200
      escalationRate: 2.0

    # Block suspicious user agents
    - id: block-bad-bots
      type: flexible
      enabled: true
      conditions:
        - field: user-agent
          method: regex
          values: ["(bot|crawler|scraper|scanner|sqlmap|nikto|nmap|masscan|nessus|acunetix|metasploit)"]

    # Block missing or suspicious user agents
    - id: block-no-user-agent
      type: flexible
      enabled: true
      conditions:
        - field: user-agent
          method: equals
          values: ["", "-", "Mozilla"]  # Common for bots

    # Block suspicious HTTP methods
    - id: block-suspicious-methods
      type: flexible
      enabled: true
      conditions:
        - field: method
          method: equals
          values: ["TRACE", "TRACK", "DEBUG", "OPTIONS"]

    # Strict global rate limit
    - id: global-rate-limit
      type: composite
      enabled: true
      keys: ["ip"]
      conditions: []
      limit: 1000
      period: 3600
      duration: 1800
      escalationRate: 2.0

    # Country-specific strict limits
    - id: risky-country-limit
      type: composite
      enabled: true
      keys: ["ip"]
      conditions:
        - field: country
          method: equals
          values: ["CN", "RU"]  # Adjust based on your threat model
      limit: 10
      period: 60
      duration: 7200  # 2 hour ban
      escalationRate: 5.0

# API with strong authentication
api:
  enabled: true
  auth:
    enabled: true
    username: "admin"
    password: "CHANGE-THIS-TO-VERY-STRONG-PASSWORD"  # Min 20 chars, random

# Security notes:
# - Start in 'audit' mode and monitor logs before switching to 'normal'
# - Whitelist your own IPs to avoid locking yourself out
# - Test admin access before deploying
# - Monitor metrics for false positives
# - Adjust country blocks based on your legitimate traffic
# - Use strong API password and restrict network access
# - Keep GeoIP databases updated
# - Regularly review and update threat feeds
