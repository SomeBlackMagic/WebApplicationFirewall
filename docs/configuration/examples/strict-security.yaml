# Strict Security WAF Configuration
# Maximum protection with aggressive rules and multiple security layers

proxy:
  host: "http://backend:8080"

api:
  auth:
    enabled: true
    username: 'admin'
    password: 'CHANGE-TO-VERY-STRONG-PASSWORD'  # Minimum 20 characters, random

metrics:
  enabled: true
  auth:
    enabled: true
    username: 'prometheus'
    password: 'CHANGE-THIS-PASSWORD'

wafMiddleware:
  mode: normal

  bannedResponse:
    httpCode: 429
    json: '{"error":"Too many requests","retryAfter":300}'
    html: ''
    htmlLink: ''

  detectClientIp:
    headers:
      - "x-forwarded-for"
      - "cf-connecting-ip"
      - "x-real-ip"

  detectClientCountry:
    method: geoip

  detectClientCity:
    method: geoip

  # Strict whitelist - only known good sources
  whitelist:
    ips: []
    ipSubnet:
      - "192.168.1.0/24"  # Office network only
    geoCountry: []  # Consider limiting to ["US", "GB"] if applicable
    geoCity: []

  # Block high-risk countries and known threats
  blacklist:
    ips: []
    ipSubnet: []
    geoCountry: ["CN", "RU", "KP"]  # Adjust based on your legitimate traffic
    geoCity: []

jailManager:
  enabled: true
  storage:
    driver: file
    driverConfig:
      filePath: data/blocked_ips.json
      locker:
        enabled: true
        config:
          retries: 5

  filterRules:
    # External threat intelligence feed
    - name: "threat-feed"
      type: "static"
      linkUrl: "https://feeds.example.com/malicious-ips.json"  # Update with real feed
      updateInterval: 3600000  # Update hourly

    # Extremely strict login protection
    - name: "login-bruteforce"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions:
        - field: 'url'
          check:
            - method: 'equals'
              values: ["/login", "/auth", "/signin", "/api/auth"]
      period: 600     # 10 minutes
      limit: 3        # Only 3 attempts
      duration: 3600  # Ban for 1 hour
      escalationRate: 3.0

    # Admin area - geo-restricted (flexible rule)
    - name: "admin-geo-block"
      type: "flexible"
      conditions:
        - field: 'url'
          check:
            - method: 'regexp'
              values: ["/^\/(admin|wp-admin|phpmyadmin)/"]
        - field: 'geo-country'
          check:
            - method: 'equals'
              values: ["RU", "CN"]  # Block these countries from admin
      period: 60
      limit: 1
      duration: 86400
      escalationRate: 1.0

    # Admin area - rate limited
    - name: "admin-rate-limit"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions:
        - field: 'url'
          check:
            - method: 'regexp'
              values: ["/^\/(admin|wp-admin)/"]
      period: 60
      limit: 20
      duration: 1800
      escalationRate: 2.5

    # API - strict per-endpoint limits
    - name: "api-per-endpoint"
      type: "composite"
      uniqueClientKey: ["ip", "url"]
      conditions:
        - field: 'url'
          check:
            - method: 'regexp'
              values: ["/^\/api\//"]
      period: 60
      limit: 30       # Strict limit
      duration: 600
      escalationRate: 2.0

    # API - global limit per IP
    - name: "api-global-limit"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions:
        - field: 'url'
          check:
            - method: 'regexp'
              values: ["/^\/api\//"]
      period: 60
      limit: 300
      duration: 1200
      escalationRate: 2.0

    # Block suspicious user agents
    - name: "block-bad-bots"
      type: "flexible"
      conditions:
        - field: 'user-agent'
          check:
            - method: 'regexp'
              values: ["/(bot|crawler|scraper|scanner|sqlmap|nikto|nmap|masscan|nessus|acunetix|metasploit)/i"]
      period: 60
      limit: 1
      duration: 86400
      escalationRate: 2.0

    # Block missing or suspicious user agents
    - name: "block-no-user-agent"
      type: "flexible"
      conditions:
        - field: 'user-agent'
          check:
            - method: 'equals'
              values: ["", "-", "Mozilla"]
      period: 60
      limit: 5
      duration: 3600
      escalationRate: 2.0

    # Block suspicious HTTP methods
    - name: "block-suspicious-methods"
      type: "flexible"
      conditions:
        - field: 'header-request-method'
          check:
            - method: 'equals'
              values: ["TRACE", "TRACK", "DEBUG"]
      period: 60
      limit: 1
      duration: 86400
      escalationRate: 1.0

    # Strict global rate limit
    - name: "global-rate-limit"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions: []
      period: 3600
      limit: 1000     # Strict limit
      duration: 1800
      escalationRate: 2.0

    # Country-specific strict limits
    - name: "risky-country-limit"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions:
        - field: 'geo-country'
          check:
            - method: 'equals'
              values: ["CN", "RU"]
      period: 60
      limit: 10       # Very low limit
      duration: 7200  # 2 hour ban
      escalationRate: 5.0

sentry:
  enabled: false
  dsn: ''  # Set via SENTRY_DSN environment variable
  debug: false

# Security notes:
# - Test in 'audit' mode first to avoid false positives
# - Whitelist your own IPs to avoid lockout
# - Monitor metrics for blocked legitimate users
# - Adjust country blocks based on your actual traffic
# - Keep threat feeds updated
# - Use strong API passwords and restrict network access
