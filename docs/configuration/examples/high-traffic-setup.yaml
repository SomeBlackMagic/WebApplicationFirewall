# High-Traffic WAF Configuration
# Optimized for high-throughput scenarios with minimal overhead

proxy:
  host: "http://backend:8080"

api:
  auth:
    enabled: true
    username: 'admin'
    password: 'CHANGE-THIS-PASSWORD'

metrics:
  enabled: true
  auth:
    enabled: false  # Disable for faster metrics collection
    username: 'prometheus'
    password: 'password'

wafMiddleware:
  mode: normal

  # Minimal response for performance
  bannedResponse:
    httpCode: 429
    json: ''
    html: ''
    htmlLink: ''

  detectClientIp:
    headers:
      - "x-forwarded-for"

  detectClientCountry:
    method: geoip

  detectClientCity:
    method: geoip

  # Whitelist internal traffic to bypass all checks
  whitelist:
    ips: []
    ipSubnet:
      - "10.0.0.0/8"
      - "192.168.0.0/16"
    geoCountry: []
    geoCity: []

jailManager:
  enabled: true
  storage:
    driver: file
    driverConfig:
      filePath: data/blocked_ips.json
      locker:
        enabled: true
        config:
          retries: 3

  # PERFORMANCE: Fewer rules = less overhead. Focus on critical protection only.
  filterRules:
    # Strict login protection (critical)
    - name: "login-protection"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions:
        - field: 'url'
          check:
            - method: 'equals'
              values: ["/api/auth/login"]
      period: 300
      limit: 3        # Very strict
      duration: 1800  # Long ban
      escalationRate: 3.0

    # Relaxed API limits for legitimate high traffic
    - name: "api-per-endpoint"
      type: "composite"
      uniqueClientKey: ["ip", "url"]
      conditions:
        - field: 'url'
          check:
            - method: 'regexp'
              values: ["/^\/api\//"]
      period: 60
      limit: 500      # Higher limit
      duration: 180   # Shorter ban
      escalationRate: 1.3

    # High global limit
    - name: "global-limit"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions: []
      period: 3600
      limit: 50000    # Very high limit
      duration: 300
      escalationRate: 1.2

    # Block only obvious scanners
    - name: "block-scanners"
      type: "flexible"
      conditions:
        - field: 'user-agent'
          check:
            - method: 'regexp'
              values: ["/(sqlmap|nikto|masscan|nessus|acunetix)/i"]
      period: 60
      limit: 1
      duration: 86400
      escalationRate: 1.5

sentry:
  enabled: false
  dsn: ''
  debug: false

# Performance optimization notes:
# - Reduced number of rules (each rule adds processing overhead)
# - Higher rate limits (focus on real attacks, not legitimate bursts)
# - Shorter ban durations (reduces storage size and lookup time)
# - Whitelist internal traffic (bypasses all checks)
# - Disabled metrics auth (reduces auth overhead on every scrape)
# - Simple bannedResponse (no HTML rendering)
