# Basic WAF Configuration
# Minimal configuration to get started quickly

proxy:
  host: "http://localhost:8080"  # Change to your backend URL

api:
  auth:
    enabled: false  # Enable for production
    username: 'admin'
    password: 'admin'

metrics:
  enabled: true
  auth:
    enabled: false
    username: 'admin'
    password: 'admin'

wafMiddleware:
  # Operating mode: 'audit' for testing (logs only), 'normal' for production (blocks requests)
  mode: audit

  # Optional: Customize banned response
  # bannedResponse:
  #   httpCode: 429
  #   json: ''
  #   html: ''
  #   htmlLink: ''

  # Client IP detection (important if behind a proxy/CDN)
  detectClientIp:
    headers:
      - "x-forwarded-for"

  # Geolocation detection method
  detectClientCountry:
    method: geoip  # 'geoip' uses local database, 'header' uses CDN header
    # header: 'X-client-country'  # Only if method is 'header'

  detectClientCity:
    method: geoip  # 'geoip' uses local database, 'header' uses CDN header
    # header: 'X-client-city'  # Only if method is 'header'

  # Optional: Whitelist trusted sources (bypasses all checks)
  # whitelist:
  #   ips: ['127.0.0.1']
  #   ipSubnet: ['192.168.0.0/16', '10.0.0.0/8']
  #   geoCountry: []
  #   geoCity: []

  # Optional: Blacklist sources (blocked immediately)
  # blacklist:
  #   ips: []
  #   ipSubnet: []
  #   geoCountry: []
  #   geoCity: []

jailManager:
  enabled: true
  storage:
    driver: memory  # Use 'file' for production to persist bans across restarts
    # driverConfig:  # Only for 'file' driver
    #   filePath: data/blocked_ips.json
    #   locker:
    #     enabled: true
    #     config:
    #       retries: 3

  filterRules:
    # Basic global rate limit
    - name: "global-rate-limit"
      type: "composite"
      uniqueClientKey: ["ip"]
      conditions: []  # Applies to all requests
      period: 60      # Time window in seconds
      limit: 1000     # Max requests per period
      duration: 300   # Ban duration in seconds (5 minutes)
      escalationRate: 1.5  # Multiplier for repeat offenses

sentry:
  enabled: false
  dsn: ''
  debug: false
